<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aplică pentru Vio Bulz Coaching</title>

<style>
:root{
  --bg:#070707;
  --panel:#111;
  --text:#f5f5f5;
  --muted:#aaa;
  --red:#e31319;
  --line:#2a2a2a;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  line-height:1.55;
}

.container{
  width:min(760px,92%);
  margin:auto;
}

.top{
  text-align:center;
  padding:70px 0 35px;
  border-bottom:1px solid var(--line);
}

.kicker{
  color:var(--red);
  font-weight:800;
  letter-spacing:3px;
  text-transform:uppercase;
  font-size:.8rem;
}

h1{
  font-size:clamp(2.3rem,7vw,4.5rem);
  line-height:.95;
  margin:16px 0;
}

h1 span{
  color:var(--red);
}

.lead{
  color:var(--muted);
  font-size:1.05rem;
}

.language-box{
  margin:25px auto 0;
  max-width:300px;
}

.language-box label{
  display:block;
  font-weight:800;
  margin-bottom:8px;
  text-align:left;
}

form{
  padding:45px 0 70px;
}

.group{
  margin:0 0 24px;
}

label{
  display:block;
  font-weight:800;
  margin-bottom:8px;
}

input,select,textarea{
  width:100%;
  background:var(--panel);
  border:1px solid var(--line);
  color:var(--text);
  padding:14px;
  border-radius:4px;
  font-size:1rem;
}

textarea{
  min-height:130px;
  resize:vertical;
}

.options{
  display:grid;
  gap:10px;
}

.option{
  display:flex;
  align-items:center;
  gap:10px;
  background:var(--panel);
  border:1px solid var(--line);
  padding:12px;
}

.option input{
  width:auto;
}

.note{
  font-size:.85rem;
  color:#888;
  margin-top:6px;
}

.consent{
  display:flex;
  gap:10px;
  align-items:flex-start;
  color:#aaa;
  font-size:.9rem;
}

.consent input{
  width:auto;
  margin-top:4px;
}

button{
  width:100%;
  border:0;
  background:var(--red);
  color:#fff;
  font-weight:900;
  padding:17px;
  border-radius:4px;
  font-size:1rem;
  text-transform:uppercase;
  letter-spacing:.6px;
  cursor:pointer;
}

.back{
  text-align:center;
  padding-bottom:45px;
}

.back a{
  color:#fff;
  text-decoration:none;
}
</style>
</head>

<body>

<header class="top">
<div class="container">

<div class="kicker" id="kicker">Vio Bulz Coaching</div>

<h1 id="title">
APLICĂ PENTRU<br>
<span>COACHING</span>
</h1>

<p class="lead" id="intro">
Completează formularul de mai jos. Îți voi analiza răspunsurile și te voi contacta pentru a discuta obiectivul tău și următorii pași.
</p>

<div class="language-box">
<label for="language" id="languageLabel">Țara / Limba</label>

<select id="language">
<option value="ro">🇷🇴 România — Română</option>
<option value="es">🇪🇸 España — Español</option>
</select>
</div>

</div>
</header>

<main class="container">

<form action="https://formsubmit.co/viorelbulz90@gmail.com" method="POST">

<input type="hidden" name="_subject" value="Nouă aplicație — Vio Bulz Coaching">
<input type="hidden" name="_template" value="table">
<input type="hidden" name="_captcha" value="true">

<input type="hidden" name="_autoresponse"
value="Salut! Am primit aplicația ta pentru Vio Bulz Coaching. Îți mulțumesc pentru încredere! Voi analiza răspunsurile tale și te voi contacta pentru următorii pași. — Vio Bulz">

<input type="hidden" name="_next" value="Vio_Bulz_Coaching_Multumesc.html">

<input type="text" name="_honey" style="display:none"><div class="group">
<label for="name" id="nameLabel">Nume și prenume *</label>
<input id="name" name="Nume și prenume" required>
</div>

<div class="group">
<label for="age" id="ageLabel">Vârsta *</label>
<input id="age" name="Vârstă" type="number" min="16" max="100" required>
</div>

<div class="group">
<label for="email" id="emailLabel">Email *</label>
<input id="email" name="email" type="email" required>
</div>

<div class="group">
<label for="phone" id="phoneLabel">Telefon / WhatsApp *</label>
<input id="phone" name="Telefon / WhatsApp" type="tel" required>
</div>

<div class="group">
<label id="coachingLabel">Ce tip de coaching te interesează? *</label>

<div class="options">

<label class="option">
<input type="radio" name="Tip coaching" value="ONLINE" required>
<span id="onlineText">ONLINE</span>
</label>

<label class="option">
<input type="radio" name="Tip coaching" value="FIZIC">
<span id="physicalText">FIZIC</span>
</label>

<label class="option">
<input type="radio" name="Tip coaching" value="ONLINE + FIZIC">
<span id="bothText">ONLINE + FIZIC</span>
</label>

</div>
</div>

<div class="group">
<label for="goal" id="goalLabel">Care este obiectivul tău principal? *</label>

<select id="goal" name="Obiectiv principal" required>
<option value="" id="goalPlaceholder">Alege o variantă</option>
<option value="Masă musculară" id="goalMuscle">Masă musculară</option>
<option value="Slăbire" id="goalLoss">Slăbire</option>
<option value="Recompunere corporală" id="goalRecomp">Recompunere corporală</option>
<option value="Forță" id="goalStrength">Forță</option>
<option value="Condiție fizică" id="goalFitness">Condiție fizică</option>
<option value="Alt obiectiv" id="goalOther">Alt obiectiv</option>
</select>
</div>

<div class="group">
<label for="goaltext" id="goalTextLabel">
Spune-mi mai exact ce vrei să obții. *
</label>

<textarea id="goaltext" name="Obiectiv detaliat" required></textarea>
</div>

<div class="group">
<label for="experience" id="experienceLabel">
De cât timp te antrenezi?
</label>

<select id="experience" name="Experiență sală">

<option value="" id="experiencePlaceholder">
Alege o variantă
</option>

<option value="Sunt începător" id="experienceBeginner">
Sunt începător
</option>

<option value="Sub 6 luni" id="experience6">
Sub 6 luni
</option>

<option value="6–12 luni" id="experience12">
6–12 luni
</option>

<option value="1–2 ani" id="experience2">
1–2 ani
</option>

<option value="Peste 2 ani" id="experienceMore">
Peste 2 ani
</option>

</select>
</div>

<div class="group">
<label for="frequency" id="frequencyLabel">
De câte ori pe săptămână poți să te antrenezi?
</label>

<select id="frequency" name="Frecvență antrenamente">

<option value="" id="frequencyPlaceholder">
Alege o variantă
</option>

<option value="2 ori">2 ori</option>
<option value="3 ori">3 ori</option>
<option value="4 ori">4 ori</option>
<option value="5 ori">5 ori</option>
<option value="6+ ori">6+ ori</option>

</select>
</div><div class="group">
<label id="packageLabel">Ce pachet te interesează acum?</label>

<div class="options">

<label class="option">
<input type="radio" name="Pachet dorit" value="Basic">
<span id="basicText">Basic</span>
</label>

<label class="option">
<input type="radio" name="Pachet dorit" value="Transform">
<span id="transformText">Transform</span>
</label>

<label class="option">
<input type="radio" name="Pachet dorit" value="Premium">
<span id="premiumText">Premium</span>
</label>

<label class="option">
<input type="radio" name="Pachet dorit" value="Transform 3 luni">
<span id="transform3Text">Transform 3 luni</span>
</label>

<label class="option">
<input type="radio" name="Pachet dorit" value="Nu știu încă">
<span id="dontKnowText">Nu știu încă — vreau să discutăm</span>
</label>

</div>
</div>

<div class="group">
<label for="why" id="whyLabel">
De ce vrei să începi coaching-ul acum? *
</label>

<textarea id="why" name="De ce acum" required></textarea>
</div>

<div class="group">
<label for="coach" id="coachLabel">
Ai mai lucrat cu un antrenor?
</label>

<select id="coach" name="Experiență cu antrenor">

<option value="" id="coachPlaceholder">
Alege o variantă
</option>

<option value="Da" id="coachYes">Da</option>
<option value="Nu" id="coachNo">Nu</option>

</select>
</div>

<div class="group">
<label for="extra" id="extraLabel">
Mai este ceva ce ai vrea să știu înainte să te contactez?
</label>

<textarea id="extra" name="Informații suplimentare"></textarea>
</div>

<div class="group consent">

<input id="consent" type="checkbox" name="Acord contact" value="Da" required>

<label for="consent" id="consentLabel">
Sunt de acord ca Vio Bulz Coaching să mă contacteze în legătură cu această solicitare.
</label>

</div>

<button type="submit" id="submitButton">
Trimite aplicația
</button>

</form>

<div class="back">
<a href="Vio_Bulz_Coaching_Landing_Page.html" id="backLink">
← Înapoi la Vio Bulz Coaching
</a>
</div>

</main>
